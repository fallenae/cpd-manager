services:
  cpd-manager:
    build: .
    container_name: mit-cpd-manager
    init: true
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      DATA_DIR: /data
      CPD_ADMIN_USERNAME: ${CPD_ADMIN_USERNAME:-admin}
      CPD_ADMIN_PASSWORD: ${CPD_ADMIN_PASSWORD:?Set CPD_ADMIN_PASSWORD in .env}
      CPD_ADMIN_DISPLAY_NAME: ${CPD_ADMIN_DISPLAY_NAME:-Administrator}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
